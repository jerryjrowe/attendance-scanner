<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Attendance Scanner</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="scanner.css" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<div id="app">

  <div id="header">
    <span id="school-name-display">Attendance Scanner</span>
    <div id="header-controls">
      <div id="connection-status">
        <span id="connection-label">checking…</span>
        <div id="connection-dot"></div>
      </div>
      <button id="fullscreen-btn" type="button" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path id="fullscreen-icon-path" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </button>
      <button id="refresh-btn" type="button" title="Force Refresh" aria-label="Force Refresh">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08a5.99 5.99 0 01-5.65 4c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="camera-wrap">
    <div id="reader"></div>
    <div id="brackets">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>
  </div>

  <div id="result-card" class="state-idle">
    <div id="result-label">LAST SCAN</div>
    <div id="result-name">Waiting for scan…</div>
    <div id="result-meta"></div>
  </div>

  <div id="recents-wrap">
    <div id="recents-label">Recent Check-ins</div>
    <ul id="recents-list">
      <li><span class="r-name">No scans yet today.</span></li>
    </ul>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════════════
// FIXED CONFIGURATION — edit these three lines, then re-upload
// this file to GitHub Pages. There is no in-app settings screen.
// ════════════════════════════════════════════════════════════
var BACKEND_URL   = "https://script.google.com/macros/s/AKfycbxq9ZFkuPd5pMFsgGtaWOBg95sOQJo-S3j8Z6prLxq7Z0npwmvW5tyrgKTtJYKeZDc_/exec";
var SCHOOL_NAME   = "Northside";
var CAMERA_FACING = "user"; // "user" = front camera (faces the person scanning)
// ════════════════════════════════════════════════════════════

// ── State ─────────────────────────────────────────────────────
var scanner          = null;
var lastScannedValue = "";
var cooldownMs       = 5000;
var lastScanTime     = 0;
var recents          = [];

// ── DOM refs ──────────────────────────────────────────────────
var elSchoolDisplay  = document.getElementById("school-name-display");
var elConnectionDot  = document.getElementById("connection-dot");
var elConnectionLbl  = document.getElementById("connection-label");
var elResultCard     = document.getElementById("result-card");
var elResultLabel    = document.getElementById("result-label");
var elResultName     = document.getElementById("result-name");
var elResultMeta     = document.getElementById("result-meta");
var elRecentsList    = document.getElementById("recents-list");
var elFullscreenBtn  = document.getElementById("fullscreen-btn");
var elFullscreenIcon = document.getElementById("fullscreen-icon-path");
var elRefreshBtn     = document.getElementById("refresh-btn");
var elCameraWrap     = document.getElementById("camera-wrap");

var ICON_FULLSCREEN_ENTER = "M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z";
var ICON_FULLSCREEN_EXIT  = "M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z";

// ── Init ──────────────────────────────────────────────────────
function init() {
  elSchoolDisplay.textContent = SCHOOL_NAME;

  if (BACKEND_URL.indexOf("PASTE_YOUR") !== -1) {
    setResultState("error", "Backend URL not set.", "Edit BACKEND_URL near the top of scanner.html.", "");
    return;
  }

  pingBackend();
  startScanner();
}

// ── Connection state ──────────────────────────────────────────
function pingBackend() {
  setConnectionState("checking");
  fetch(BACKEND_URL + "?action=ping")
    .then(function(r) { return r.json(); })
    .then(function(d) { setConnectionState(d.status === "ok" ? "connected" : "disconnected"); })
    .catch(function()  { setConnectionState("disconnected"); });
}

function setConnectionState(state) {
  elConnectionDot.className = "";
  if (state === "connected") {
    elConnectionDot.classList.add("connected");
    elConnectionLbl.textContent = "connected";
  } else if (state === "disconnected") {
    elConnectionDot.classList.add("disconnected");
    elConnectionLbl.textContent = "offline";
  } else {
    elConnectionLbl.textContent = "checking…";
  }
}

// ── QR Scanner ────────────────────────────────────────────────
function startScanner() {
  if (scanner) { scanner.clear().catch(function(){}); scanner = null; }

  // Front camera reads like a video call unless we mirror the preview —
  // the raw frames html5-qrcode decodes from are unaffected by this CSS flip.
  elCameraWrap.classList.toggle("mirrored", CAMERA_FACING === "user");

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: CAMERA_FACING },
    {
      fps: 10,
      qrbox: function(w, h) {
        var side = Math.min(w, h) * 0.70;
        return { width: side, height: side };
      },
      aspectRatio: 1.0,
      disableFlip: false
    },
    onScanSuccess,
    function() {} // onScanFailure fires constantly when no code visible — ignore
  ).catch(function(err) {
    setResultState("error", "Camera error: " + err, "", "");
  });
}

function onScanSuccess(decodedText) {
  var now = Date.now();
  if (decodedText === lastScannedValue && (now - lastScanTime) < cooldownMs) return;

  lastScannedValue = decodedText;
  lastScanTime     = now;

  setResultState("loading", decodedText.length > 40 ? decodedText.substring(0, 40) + "…" : decodedText, "", "");
  sendToBackend(decodedText);
}

// ── Backend communication ─────────────────────────────────────
function sendToBackend(qrValue) {
  fetch(BACKEND_URL + "?action=scan&qrValue=" + encodeURIComponent(qrValue))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      setConnectionState("connected");
      if (data.status === "ok") {
        setResultState("ok", data.studentName, data.grade || "", data.timestamp || "");
        addRecent(data.studentName, "ok");
      } else if (data.status === "unknown") {
        setResultState("unknown", data.studentName, "Not on student list — logged anyway", "");
        addRecent(data.studentName, "unknown");
      } else {
        setResultState("error", "Error", data.message || "Unknown error", "");
        addRecent("Error", "error");
      }
    })
    .catch(function() {
      setConnectionState("disconnected");
      setResultState("error", "Connection failed", "Could not reach backend.", "");
    });
}

// ── Result card ───────────────────────────────────────────────
var resetTimer = null;

function setResultState(state, name, meta, timestamp) {
  elResultCard.className = "state-" + state;

  elResultLabel.textContent =
    state === "ok"      ? "✓ CHECKED IN"      :
    state === "unknown" ? "⚠ UNKNOWN STUDENT" :
    state === "error"   ? "✗ ERROR"            :
    state === "loading" ? "SCANNING…"          :
                          "LAST SCAN";

  elResultName.textContent = name;

  var metaText = meta;
  if (timestamp) {
    var parts = timestamp.split(" ");
    if (parts.length > 1) {
      var t = parts[1].split(":");
      metaText += "  ·  " + t[0] + ":" + t[1];
    }
  }
  elResultMeta.textContent = metaText;

  // Auto-reset to idle after 4 seconds for non-loading states
  if (resetTimer) clearTimeout(resetTimer);
  if (state !== "loading") {
    resetTimer = setTimeout(function() {
      setResultState("idle", "Waiting for scan…", "", "");
    }, 4000);
  }
}

// ── Recent scans ──────────────────────────────────────────────
function addRecent(name, state) {
  var now = new Date();
  var t   = now.getHours().toString().padStart(2, "0") + ":" +
            now.getMinutes().toString().padStart(2, "0");
  recents.unshift({ name: name, time: t, state: state });
  if (recents.length > 8) recents.pop();
  renderRecents();
}

function renderRecents() {
  elRecentsList.innerHTML = recents.map(function(r) {
    return '<li class="r-' + r.state + '">' +
           '<span class="r-name">' + esc(r.name) + '</span>' +
           '<span class="r-time">' + r.time + '</span>' +
           '</li>';
  }).join("") || '<li><span class="r-name">No scans yet today.</span></li>';
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── Fullscreen toggle ─────────────────────────────────────────
elFullscreenBtn.addEventListener("click", function() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(function(){});
  } else {
    document.exitFullscreen();
  }
});

document.addEventListener("fullscreenchange", function() {
  var isFullscreen = !!document.fullscreenElement;
  elFullscreenBtn.classList.toggle("active", isFullscreen);
  elFullscreenIcon.setAttribute("d", isFullscreen ? ICON_FULLSCREEN_EXIT : ICON_FULLSCREEN_ENTER);
});

// ── Force refresh ─────────────────────────────────────────────
// A plain reload() can still be served from cache. Navigating to a
// URL with a unique query string forces the browser to treat this
// page as new and fetch it fresh from the network.
elRefreshBtn.addEventListener("click", function() {
  location.href = location.pathname + "?forcerefresh=" + Date.now();
});

// ── Go ────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
